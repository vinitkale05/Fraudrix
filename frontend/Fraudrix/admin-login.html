<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login | Fraudrix AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#b1eb53",
                    "background": "#121414",
                    "surface-container": "#1e2020",
                    "primary-container": "#96ce39",
                    "on-surface": "#e2e2e2",
                    "on-surface-variant": "#c3c9b2",
                    "outline-variant": "#434937",
                    "error": "#ffb4ab"
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #121414;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(177, 235, 83, 0.1) 0%, transparent 50%);
        }
    </style>
</head>
<body class="font-inter text-on-surface min-h-screen flex flex-col justify-center items-center px-6">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-block px-3 py-1 rounded-full bg-primary/10 border border-primary/20 text-primary text-[10px] font-bold uppercase tracking-widest mb-4">Internal System</div>
            <h1 class="text-3xl font-black tracking-tighter text-white uppercase mb-2">Admin Portal</h1>
            <p class="text-on-surface-variant text-sm">Elevated access required. Please authenticate.</p>
        </div>

        <div class="bg-surface-container border border-white/10 p-8 rounded-2xl shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
            
            <form id="adminLoginForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest" for="email">Admin ID</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">admin_panel_settings</span>
                        <input class="w-full bg-[#161818] border border-outline-variant rounded-xl py-3 pl-12 pr-4 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="email" placeholder="admin@fraudrix.ai" type="email" required value="admin@fraudrix.ai"/>
                    </div>
                </div>
                
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest" for="password">Security Key</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">key</span>
                        <input class="w-full bg-[#161818] border border-outline-variant rounded-xl py-3 pl-12 pr-4 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="password" placeholder="••••••••" type="password" required value="Admin@123"/>
                    </div>
                </div>

                <div id="loginError" class="text-error text-xs hidden bg-error/10 p-3 rounded-lg border border-error/20"></div>

                <button class="w-full bg-primary text-black font-bold py-4 rounded-xl flex items-center justify-center gap-2 hover:brightness-110 active:scale-[0.98] transition-all" type="submit">
                    <span id="btnText">Access Command Center</span>
                    <span id="btnIcon" class="material-symbols-outlined">shield</span>
                </button>
            </form>
        </div>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-on-surface-variant hover:text-white text-xs flex items-center justify-center gap-2 transition-colors">
                <span class="material-symbols-outlined text-sm">arrow_back</span> Return to Main Site
            </a>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            console.log('Admin login attempt...');
            errorDiv.classList.add('hidden');
            btnText.innerText = 'Authenticating...';
            btnIcon.classList.add('animate-pulse');

            try {
                const tryFetch = async (url, options) => {
                    try { return await fetch(url, options); }
                    catch (e) {
                        if (url.includes('localhost')) return await fetch(url.replace('localhost', '127.0.0.1'), options);
                        throw e;
                    }
                };

                const response = await tryFetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                console.log('Login response:', data);

                if (response.ok) {
                    localStorage.setItem('fraudrix_admin_token', data.token);
                    localStorage.setItem('fraudrix_admin_user', JSON.stringify(data.user));
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorDiv.innerText = data.error || 'Authentication failed.';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Login error:', err);
                errorDiv.innerText = 'Server communication error. Is the backend running on port 5000?';
                errorDiv.classList.remove('hidden');
            } finally {
                btnText.innerText = 'Access Command Center';
                btnIcon.classList.remove('animate-pulse');
            }
        });
    </script>
</body></html>
